---
- name: Configure web server avec Tailscale HTTPS
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Install Tailscale
      shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Ensure certificate directory exists
      file:
        path: /etc/nginx/certs
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Start tailscaled service
      systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Connect VM to Tailscale tailnet
      shell: >
        tailscale up
        --authkey={{ tailscale_vm_authkey }}
        --hostname=vm-test-proxmox-1
        --accept-routes
      register: ts_up
      changed_when: ts_up.rc == 0

    - name: Wait for Tailscale to be ready
      pause:
        seconds: 15

    - name: Get Tailscale DNS name
      shell: >
        tailscale status --json |
        python3 -c "import sys,json;
        d=json.load(sys.stdin);
        print(d['Self']['DNSName'].rstrip('.'))"
      register: ts_dns
      changed_when: false

    - name: Display Tailscale DNS name
      debug:
        msg: "Tailscale DNS: {{ ts_dns.stdout }}"

    - name: Provision Tailscale SSL Certificate
      shell: >
        tailscale cert
        --cert-file /etc/nginx/certs/cert.crt
        --key-file /etc/nginx/certs/cert.key
        {{ ts_dns.stdout }}
      args:
        creates: /etc/nginx/certs/cert.crt

    - name: Set certificate permissions
      file:
        path: "{{ item }}"
        owner: www-data
        group: www-data
        mode: '0640'
      loop:
        - /etc/nginx/certs/cert.crt
        - /etc/nginx/certs/cert.key

    - name: Configure Nginx HTTPS
      copy:
        dest: /etc/nginx/sites-available/app
        content: |
          server {
              listen 80;
              server_name {{ ts_dns.stdout }};
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              server_name {{ ts_dns.stdout }};
              ssl_certificate     /etc/nginx/certs/cert.crt;
              ssl_certificate_key /etc/nginx/certs/cert.key;
              ssl_protocols       TLSv1.2 TLSv1.3;
              ssl_ciphers         HIGH:!aNULL:!MD5;
              add_header Strict-Transport-Security "max-age=31536000" always;
              add_header X-Frame-Options DENY;
              add_header X-Content-Type-Options nosniff;
              location / {
                  root /var/www/html;
                  index index.html;
              }
          }
        mode: '0644'

    - name: Enable site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Deploy page web depuis index.html
      copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: true

    - name: Verify HTTPS is working
      uri:
        url: "https://{{ ts_dns.stdout }}"
        validate_certs: false
        status_code: 200
      register: result
      retries: 3
      delay: 5

    - name: Display result
      debug:
        msg: "✅ HTTPS OK — {{ ts_dns.stdout }} répond avec status {{ result.status }}"
