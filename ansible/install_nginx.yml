---
- name: Configure web server with Tailscale HTTPS
  hosts: all
  become: true

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Install Tailscale (pour corriger l'erreur No such file)
      shell: "curl -fsSL https://tailscale.com/install.sh | sh"
      args:
        creates: /usr/bin/tailscale

    - name: Ensure certificate directory exists
      file:
        path: /etc/nginx/certs
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Provision Tailscale SSL Certificate
      command: "tailscale cert --cert-file /etc/nginx/certs/cert.crt --key-file /etc/nginx/certs/cert.key {{ ansible_hostname }}.tailfd58bd.ts.net"

    - name: Configure Nginx with SSL
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;
              listen 443 ssl;
              server_name {{ ansible_hostname }}.tailfd58bd.ts.net;

              ssl_certificate /etc/nginx/certs/cert.crt;
              ssl_certificate_key /etc/nginx/certs/cert.key;

              location / {
                  root /var/www/html;
                  index index.html;
              }
          }
      notify: Restart Nginx

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
