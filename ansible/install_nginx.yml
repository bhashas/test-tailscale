---
- name: Configure web server with Tailscale HTTPS
  hosts: all
  become: true

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure certificate directory exists
      file:
        path: /etc/nginx/certs
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Provision Tailscale SSL Certificate
      # On utilise le nom de la machine défini dans Proxmox pour le certificat
      command: "tailscale cert --cert-file /etc/nginx/certs/cert.crt --key-file /etc/nginx/certs/cert.key {{ ansible_hostname }}.tailfd58bd.ts.net"
      changed_when: true

    - name: Mise en place de la page Web pro
      copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Configure Nginx for HTTP and HTTPS
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;
              listen 443 ssl;
              server_name {{ ansible_hostname }}.tailfd58bd.ts.net;

              ssl_certificate /etc/nginx/certs/cert.crt;
              ssl_certificate_key /etc/nginx/certs/cert.key;

              location / {
                  root /var/www/html;
                  index index.html;
              }
          }
      notify: Restart Nginx

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
