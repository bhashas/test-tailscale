---
- name: Configure web server avec Tailscale HTTPS
  hosts: webservers
  become: true

  tasks:
    # --- SECTION 1 : PRÉPARATION DU SYSTÈME ET NGINX ---
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    # --- SECTION 2 : INSTALLATION DE TAILSCALE ---
    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: '0755'

    - name: Install Tailscale
      ansible.builtin.command: # <-- Changé shell en command (fix warning)
        cmd: /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Start tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    # --- SECTION 3 : CONNEXION AU RÉSEAU TAILSCALE ---
    - name: Connect VM to Tailscale tailnet
      ansible.builtin.command: # <-- Changé shell en command
        cmd: >
          tailscale up
          --authkey={{ tailscale_vm_authkey }}
          --hostname=vm-test-proxmox-1
          --accept-routes
      async: 30
      poll: 0
      changed_when: true

    - name: Wait for SSH to recover after tailscale up
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 60

    - name: Wait for Tailscale to be ready
      ansible.builtin.pause:
        seconds: 10

    # --- SECTION 4 : CERTIFICATS SSL ET DNS TAILSCALE ---
    - name: Get Tailscale DNS name
      ansible.builtin.shell: # On garde shell ici car il y a un pipe (|)
        cmd: |
          set -o pipefail
          tailscale status --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['Self']['DNSName'].rstrip('.'))"
      args:
        executable: /bin/bash
      register: ts_dns
      changed_when: false

    - name: Display Tailscale DNS name
      ansible.builtin.debug:
        msg: "Tailscale DNS: {{ ts_dns.stdout }}"

    - name: Ensure certificate directory exists
      ansible.builtin.file:
        path: /etc/nginx/certs
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Provision Tailscale SSL Certificate
      ansible.builtin.command: # <-- Changé shell en command
        cmd: >
          tailscale cert
          --cert-file /etc/nginx/certs/cert.crt
          --key-file /etc/nginx/certs/cert.key
          {{ ts_dns.stdout }}
      args:
        creates: /etc/nginx/certs/cert.crt
      changed_when: true

    - name: Set certificate permissions
      ansible.builtin.file:
        path: "{{ item }}"
        owner: www-data
        group: www-data
        mode: '0640'
      loop:
        - /etc/nginx/certs/cert.crt
        - /etc/nginx/certs/cert.key

    # --- SECTION 5 : CONFIGURATION NGINX HTTPS ---
    - name: Configure Nginx HTTPS
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/app
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name {{ ts_dns.stdout }};
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              server_name {{ ts_dns.stdout }};
              ssl_certificate     /etc/nginx/certs/cert.crt;
              ssl_certificate_key /etc/nginx/certs/cert.key;
              ssl_protocols       TLSv1.2 TLSv1.3;
              ssl_ciphers         HIGH:!aNULL:!MD5;
              add_header Strict-Transport-Security "max-age=31536000" always;
              add_header X-Frame-Options DENY;
              add_header X-Content-Type-Options nosniff;
              location / {
                  root /var/www/html;
                  index index.html;
              }
          }

    - name: Enable site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Deploy page web depuis index.html
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

    # --- SECTION 6 : SÉCURITÉ PARE-FEU (UFW) ---
    # Stratégie : Tout bloquer en entrée SAUF via Tailscale
    
    - name: Allow all outgoing traffic
      community.general.ufw: # <-- Changé en community.general
        rule: allow
        direction: out

    - name: Allow SSH via Tailscale only
      community.general.ufw: # <-- Changé en community.general
        rule: allow
        port: '22'
        proto: tcp
        interface: tailscale0
        direction: in

    - name: Allow HTTP/HTTPS via Tailscale only
      community.general.ufw: # <-- Changé en community.general
        rule: allow
        port: "{{ item }}"
        proto: tcp
        interface: tailscale0
        direction: in
      loop: ['80', '443']

    - name: Enable UFW and deny all other incoming traffic
      community.general.ufw: # <-- Changé en community.general
        state: enabled
        policy: deny
        direction: incoming

    # --- SECTION 7 : VÉRIFICATION FINALE ---
    - name: Verify HTTPS is working
      ansible.builtin.uri:
        url: "https://{{ ts_dns.stdout }}"
        validate_certs: false
        status_code: 200
      register: result
      retries: 3
      delay: 5

    - name: Display result
      ansible.builtin.debug:
        msg: "✅ HTTPS OK — {{ ts_dns.stdout }} répond avec status {{ result.status }}"
