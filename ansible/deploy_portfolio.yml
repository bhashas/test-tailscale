- name: Publish Portfolio Dashboard
  hosts: all
  become: yes
  tasks:
    - name: Copy portfolio files to Nginx webroot
      copy:
        src: ../index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is reloaded to apply changes
      service:
        name: nginx
        state: reloaded
