name: '🛡️ Infrastructure Drift Detection'

on:
  schedule:
    - cron: '0 0 * * *' # Tourne tous les jours à minuit (ou '0 * * * *' pour toutes les heures)
  workflow_dispatch:      # Permet de le lancer à la main pour tester depuis l'onglet Actions

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Drift Check)
        id: plan
        run: |
          # -detailed-exitcode renvoie 2 si une différence est trouvée
          terraform plan -detailed-exitcode || exit_code=$?
          if [ ${exit_code} -eq 2 ]; then
            echo "🚨 DRIFT DETECTED: Quelqu'un a modifié Proxmox manuellement !"
            exit 1
          elif [ ${exit_code} -eq 0 ]; then
            echo "✅ Infrastructure alignée avec Git."
          else
            echo "❌ Erreur lors du plan."
            exit 1
          fi
