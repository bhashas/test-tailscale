name: Proxmox-Deploy-Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Checkov — scan Terraform
        uses: bridgecrewio/checkov-action@v12.3020.0
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: HIGH,CRITICAL
          exit-code: '0'

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        run: terraform apply tfplan
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Generate Dynamic Inventory
        run: |
          echo "Génération de l'inventory pour VM 506..."
          VM_506_IP=$(terraform output -json vm_ip_addresses | jq -r '.["506"]')
          echo "VM 506 IP: $VM_506_IP"
          
          cat > ansible/inventory.ini << EOF
          [portfolio]
          vm-portfolio ansible_host=$VM_506_IP ansible_user=ubuntu
          EOF
          
          cat ansible/inventory.ini
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

  ansible:
    name: Deploy Portfolio
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Wait for VM 506 SSH
        run: |
          echo "Attente SSH VM 506..."
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_ed25519 ubuntu@192.168.192.56 exit 2>/dev/null; then
              echo "✅ VM 506 OK"
              break
            fi
            echo "Tentative $i/30..."
            sleep 10
          done

      - name: Install Ansible
        run: pip install ansible==11.1.0

      - name: Install Collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Deploy Portfolio
        run: ansible-playbook ansible/setup_portfolio.yml -i ansible/inventory.ini --private-key ~/.ssh/id_ed25519 -v

      - name: Verify
        run: curl -s http://192.168.192.56 | head -20
