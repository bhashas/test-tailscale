name: Proxmox-Deploy-Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Scan sécurité IaC
  # ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov — scan Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  # ─────────────────────────────────────────
  # JOB 2 — Terraform (provision VM)
  # ─────────────────────────────────────────
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Debug Token
        run: |
          echo "TOKEN_ID=$TF_VAR_proxmox_api_token_id"
          echo "API_URL=$TF_VAR_proxmox_api_url"
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        run: terraform apply tfplan
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

  # ─────────────────────────────────────────
  # JOB 3 — Ansible (configuration VM)
  # ─────────────────────────────────────────
  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Wait for VM SSH ready
        run: |
          echo "Attente SSH sur la VM..."
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -i ~/.ssh/id_ed25519 \
                   ubuntu@100.104.1.90 exit 2>/dev/null; then
              echo "✅ VM accessible SSH !"
              break
            fi
            echo "Tentative $i/30 — attente 10s..."
            sleep 10
          done

      - name: Add VM to known_hosts
        run: ssh-keyscan -H 100.104.1.90 >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: pip install ansible==10.7.0

      - name: Ansible lint
        run: |
          pip install ansible-lint==24.2.0
          ansible-lint ansible/install_nginx.yml || true

      - name: Run Ansible playbook
        run: |
          ansible-playbook ansible/install_nginx.yml \
            -i ansible/inventory.ini \
            --private-key ~/.ssh/id_ed25519 \
            -e "tailscale_vm_authkey=${{ secrets.TAILSCALE_VM_AUTHKEY }}" \
            -v

      - name: Verify HTTPS deployment
        run: |
          echo "Vérification HTTPS via DNS Tailscale..."
          curl -sk --max-time 15 \
            https://vm-test-proxmox-1.tailfd58bd.ts.net \
            | grep -q "Pipeline OK" \
            && echo "✅ HTTPS OK"
